name: Build Google TV app

on:
  push:
    branches: [main]
    paths: ["tv/**", ".github/workflows/tv-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Optional: set a repository variable GALLERY_URL (Settings > Secrets and
      # variables > Actions > Variables) so the app opens your site with no typing.
      - name: Build APK
        working-directory: tv
        run: gradle assembleRelease --no-daemon --stacktrace -PgalleryUrl="${{ vars.GALLERY_URL }}"

      - name: Name the file
        run: cp tv/app/build/outputs/apk/release/app-release.apk turner-room.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-latest
          name: Turner Room for Google TV
          body: Install turner-room.apk on the projector with the Downloader app.
          files: turner-room.apk
          make_latest: true
